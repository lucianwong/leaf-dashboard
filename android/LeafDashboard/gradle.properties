# JVM 参数:给 Gradle 足够内存处理 Android 构建
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Android 构建并行与缓存
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true

# 本机代理(开发机 Surge;用户级 ~/.gradle/gradle.properties 中的旧端口 7897 已失效,
# 项目级配置优先级更高,以此为准。换网络环境时同步修改。)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=6152
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=6152
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# onyxsdk-device 传递依赖 androidx.annotation(纯注解库),AGP 强制要求此开关;
# App UI 仍零 androidx
android.useAndroidX=true
